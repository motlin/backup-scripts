[package]
name = "backup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humansize = "2"
indicatif = "0.18"
json5 = "1.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Lints are configured here rather than in a separate clippy.toml so the policy
# travels with the manifest. Mirrors motlin/rust-template, scaled back where the
# strictest lints would require a large refactor of this existing ~35-module CLI.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# `unreachable_pub` flags ~480 items in this binary crate; enabling it would mean
# rewriting nearly every command module's visibility. Left as "allow" for now.
unreachable_pub = "allow"
rust_2024_compatibility = { level = "warn", priority = -1 }
# Part of rust_2024_compatibility; 30 findings here need manual scope review.
# Allowed for now so the rest of the 2024 compatibility lints stay enforced.
tail_expr_drop_order = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
